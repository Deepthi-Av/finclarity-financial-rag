[project]
name = "microsoft-financial-results-explorer"
version = "0.1.0"
description = "Week 2 financial RAG comparison over official Microsoft publications"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.28,<1",
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
    "langchain-text-splitters>=1,<2",
    "langgraph>=1,<2",
    "numpy>=2,<3",
    "pinecone>=7,<9",
    "python-dotenv>=1,<2",
    "streamlit>=1.40,<2",
    "tokenizers>=0.21,<1",
]

[project.optional-dependencies]
# RAGAS 0.4.3 imports a legacy Vertex module removed in community 0.4.2.
eval = ["ragas==0.4.3", "langchain-community==0.4.1"]

[tool.uv]
package = false
